<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>周数据总看板</title>
<link rel="stylesheet" href="./style.css">
<script defer src="./dashboard.js"></script>
</head>
<body>
<main>
<header><div><p class="eyebrow">经营分析 / 周报</p><h1>周数据总看板</h1></div><span class="badge">模拟数据</span></header>
<section class="filter" aria-label="周次筛选">
<label>起始周<select id="start"></select></label>
<label>结束周<select id="end"></select></label>
<button id="reset" type="button">全部周次</button>
<p id="status" role="status">正在加载…</p>
</section>
<section id="metrics" class="metrics" aria-label="核心指标"></section>
<section id="trend" class="panel" hidden>
<h2>周销售额趋势</h2><p class="sub">人民币 · 万元</p>
<div id="bars" class="bars"></div>
</section>
</main>
</body>
</html>
