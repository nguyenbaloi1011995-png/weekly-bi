<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>周数据看板</title>
<link rel="stylesheet" href="./style.css?v=excel-charts-v2">
<script defer src="./date-range.js?v=recent-3m-v1"></script><script defer src="./chart-history/basis.js?v=full-table-v1"></script><script defer src="./period-table.js?v=dashboard-header-v1"></script>
<link rel="stylesheet" href="./dashboard-header.css?v=1"></head>
<body data-page="index.html">
<main>
<header class="dashboard-header"><h1>周数据看板</h1></header>
<nav aria-label="看板导航"><a href="./charts.html?v=dashboard-header-v1">公司总数据看板</a><a href="./monthly.html?v=dashboard-header-v1">月数据看板</a><a href="./index.html?v=dashboard-header-v1" aria-current="page">周数据看板</a></nav>
<section class="filter" aria-label="组合筛选">
<label>开始日期<input type="date" id="start"></label>
<label>结束日期<input type="date" id="end"></label>
<label>小组<select id="group"></select></label>
<label>地区<select id="region"></select></label>
<label>产品<select id="product"></select></label>
<button id="reset" type="button">重置筛选</button>
<p id="updated"></p>
<p id="status" role="status">正在加载…</p>
</section>

<section id="trend" class="panel" hidden>
<h2>周度数据对比</h2><p class="sub">按指标比较各周</p>
<div id="bars" class="bars"></div>
</section>
</main>
</body>
</html>
